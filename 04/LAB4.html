<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //111=================================================================
        const categories = new Set();

        function addCategory(category) {
            categories.add(category);
        }

        function removeCategory(category) {
            categories.delete(category);
        }

        function hasCategory(category) {
            return categories.has(category);
        }

        function getCategoriesCount() {
            return categories.size;
        }

        function getCategories() {
            return [...categories].sort();
        }

        addCategory('Развлечения');
        addCategory('Образование');
        addCategory('Спорт');
        addCategory('Развлечения');

        console.log(getCategories());
        console.log(getCategoriesCount());
        console.log(hasCategory('Спорт'));
        removeCategory('Спорт');
        console.log(getCategories());
        //222=================================================================
        const events = [
            {id: 1, title: 'Вечер настольных игр', category: 'Развлечения', participants: 24, isActive: true},
            {id: 2, title: 'Frontend Meetup', category: 'Образование', participants: 40, isActive: true},
            {id: 3, title: 'Осенний забег', category: 'Спорт', participants: 18, isActive: false},
        ];

        const findEventById = (id) => events.find((event) => event.id === id);
        const getActiveEvents = () => events.filter((event) => event.isActive);
        const getEventsByCategory = (category) =>
            events.filter((event) => event.category === category);
        const hasEventsWithoutParticipants = () =>
            events.some((event) => event.participants === 0);
        const sortByParticipants = () =>
            [...events].sort((a, b) => a.participants - b.participants);
        const getEventTitles = () => events.map((event) => event.title);
        const getTotalParticipants = () =>
            events.reduce((sum, event) => sum + event.participants, 0);

        console.log(findEventById(2));
        console.log(getActiveEvents());
        console.log(getEventsByCategory('Спорт'));
        console.log(hasEventsWithoutParticipants());
        console.log(sortByParticipants());
        console.log(getEventTitles());
        console.log(getTotalParticipants());
        //333=================================================================
        const registrations = new Map();

        registrations.set(1, {
            title: 'Вечер настольных игр',
            participants: 2,
            price: 10,
        });

        function addRegistration(id, title, participants, price) {
            if (registrations.has(id)) {
                // Если запись уже существует — увеличиваем количество участников
                const existing = registrations.get(id);
                existing.participants += participants;
            } else {
                registrations.set(id, {title, participants, price});
            }
        }

        function hasRegistration(id) {
            return registrations.has(id);
        }

        function removeRegistration(id) {
            registrations.delete(id);
        }

        function updateParticipants(id, participants) {
            if (registrations.has(id)) {
                registrations.get(id).participants = participants;
            }
        }

        function updatePrice(id, price) {
            if (registrations.has(id)) {
                registrations.get(id).price = price;
            }
        }

        function getRegistrationsCount() {
            return registrations.size;
        }

        function getTotalTickets() {
            let total = 0;
            for (const reg of registrations.values()) {
                total += reg.participants;
            }
            return total;
        }

        function getTotalPrice() {
            let total = 0;
            for (const reg of registrations.values()) {
                total += reg.participants * reg.price;
            }
            return total;
        }

        addRegistration(1, 'Вечер настольных игр', 2, 10);
        addRegistration(2, 'Frontend Meetup', 5, 15);
        addRegistration(3, 'Осенний забег', 3, 8);

        console.log(hasRegistration(2));        // true
        console.log(getRegistrationsCount());   // 3
        console.log(getTotalTickets());         // 4 + 5 + 3 = 12
        console.log(getTotalPrice());           // 4*10 + 5*15 + 3*8 = 40 + 75 + 24 = 139

        updateParticipants(2, 10);
        updatePrice(2, 20);
        console.log(getTotalTickets());         // 4 + 10 + 3 = 17
        console.log(getTotalPrice());           // 4*10 + 10*20 + 3*8 = 40 + 200 + 24 = 264

        removeRegistration(3);
        console.log(getRegistrationsCount());   // 2
        //444=================================================================
        const statistics = {
            education: 12,
            sport: 8,
            entertainment: 15,
        };

        // Названия категорий через Object.keys
        const keys = Object.keys(statistics);
        console.log(keys); // ['education', 'sport', 'entertainment']

        // Количество мероприятий через Object.values
        const values = Object.values(statistics);
        console.log(values); // [12, 8, 15]

        // Строки вида "Образование: 12" через Object.entries
        const labels = {
            education: 'Образование',
            sport: 'Спорт',
            entertainment: 'Развлечения',
        };

        const entries = Object.entries(statistics).map(
            ([key, value]) => `${labels[key]}: ${value}`
        );
        console.log(entries);
        // ['Образование: 12', 'Спорт: 8', 'Развлечения: 15']

        // Общее количество мероприятий
        const total = Object.values(statistics).reduce((sum, value) => sum + value, 0);
        console.log(total); // 35

        // Новый объект только с категориями, где больше 10 мероприятий
        const filteredStatistics = Object.fromEntries(
            Object.entries(statistics).filter(([, value]) => value > 10)
        );
        console.log(filteredStatistics);
        // { education: 12, entertainment: 15 }
        //555=================================================================
        const cache = new WeakMap();

        const MAX_PLACES = 40; // максимальная вместимость мероприятия

        function getEventStatistics(event) {
            // Проверяем кеш
            if (cache.has(event)) {
                console.log('Результат получен из кеша');
                return cache.get(event);
            }

            // Выполняем расчёты
            console.log('Выполняется расчёт');

            const availablePlaces = MAX_PLACES - event.participants;
            const occupancyPercent = Math.round((event.participants / MAX_PLACES) * 100);

            const result = {availablePlaces, occupancyPercent};

            // Сохраняем в кеш
            cache.set(event, result);

            return result;
        }

        // Проверка
        const event = {
            id: 1,
            title: 'Вечер настольных игр',
            participants: 24,
        };

        console.log(getEventStatistics(event));
        // Выполняется расчёт
        // { availablePlaces: 16, occupancyPercent: 60 }

        console.log(getEventStatistics(event));
        // Результат получен из кеша
        // { availablePlaces: 16, occupancyPercent: 60 }

        console.log(getEventStatistics({...event}));
        // Выполняется расчёт  ← новый объект, кеш не сработал
        // { availablePlaces: 16, occupancyPercent: 60 }
    </script>
</body>

</html>
