function flattenArrays(arrays) {
    return arrays.reduce((acc, current) => {
        if (Array.isArray(current)) 
            return acc.concat(flattenArrays(current));
        return acc.concat(current);
    }, []);
}


const nestedArrays = [1, [1, 2, [3, 4]], [2, 4]];
console.log(flattenArrays(nestedArrays));

console.log('=== TASK2 ===');
function deepSum(arr) {
    return arr.reduce((sum, element) => {
        if (Array.isArray(element)) {
            return sum + deepSum(element);
        }
        return sum + element;
    }, 0);
}


const nestedArray = [1, [2, 3], [4, [5, 6]], 7];
console.log(deepSum(nestedArray)); // 28

const events = [

    category: 'education',

  {

    category: 'sport',

    capacity: 25,
  },
  {
    title: 'Music Evening',
    category: 'culture',
    participants: 70,
    capacity: 100,
  },
];

function groupAvailableEvents(events) {
	return events
		.filter((event) => event.participants < event.capacity)
		.reduce((acc, event) => {
		if (!acc[event.category]) {
			acc[event.category] = [];
		}
		acc[event.category].push(event);
		return acc;
		}, {});
}

console.log(groupAvailableEvents(events));

function analyzeEventTitle(title) {
	const words = title
		.trim()
		.split(' ')
		.filter((word) => word !== '');

	const wordCount = words.length;
	const longestWord = words.reduce(
		(longest, word) => (word.length > longest.length ? word : longest),
		''
	);
	const averageLength =
		words.reduce((sum, word) => sum + word.length, 0) / wordCount;

	return {
		wordCount,
		longestWord,
		averageLength,
	};
}

console.log(analyzeEventTitle('  JavaScript   for modern interfaces  '));

function createStorageBar(used, limit, length) {
	const isValid =
		typeof used === 'number' &&
		used >= 0 &&
		typeof limit === 'number' &&
		limit > 0 &&
		used <= limit &&
		Number.isInteger(length) &&
		length > 0;

	if (!isValid) {
		return 'Некорректные данные';
	}

	const filled = Math.round((used / limit) * length);
	const empty = length - filled;

	return '#'.repeat(filled) + '-'.repeat(empty);
}

function createStorageReport(storages, length) {
	return storages.map((storage) => {
		const bar = createStorageBar(storage.used, storage.limit, length);

		if (bar === 'Некорректные данные') {
		return `${storage.user}: Некорректные данные`;
		}

		const percent = Math.round((storage.used / storage.limit) * 100);
		return `${storage.user}: ${bar} ${percent}%`;
	});
}

const storages = [
	{ user: 'Анна', used: 45, limit: 60 },
	{ user: 'Максим', used: 100, limit: 100 },
];

console.log(createStorageReport(storages, 10));
