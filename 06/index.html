        const events = [

        // Создание нового массива с новым элементом
        const eventsWithNewEvent = [...events, newEvent];

        // Функция обновления
        function updateEvent(events, eventId, changes) {
            return events.map(event => {
                if (event.id === eventId) {
                    return { ...event, ...changes }; // Возвращаем обновленную копию объекта
                }
                return event; // Возвращаем старый объект (поверхностная ссылка)
            });
        }

        //666=================================================
        function calculateAverage(...values) {
            // Проверка на наличие элементов
            if (values.length === 0) {
                return 'Некорректные данные';
            }

            // Проверка, что все элементы — числа
            const allNumbers = values.every(val => typeof val === 'number' && !isNaN(val));
            if (!allNumbers) {
                return 'Некорректные данные';
            }

            // Расчёт суммы через reduce и деление на количество
            const sum = values.reduce((acc, curr) => acc + curr, 0);
            return sum / values.length;
        }

        // Примеры тестов
        console.log(calculateAverage(8, 9, 10));      // 9
        console.log(calculateAverage(5, 7, 8, 10));   // 7.5
        console.log(calculateAverage());              // 'Некорректные данные'
        console.log(calculateAverage(5, '9', 10));    // 'Некорректные данные'

        const scores = [8, 9];
        console.log(calculateAverage(...scores));     // 8.5
